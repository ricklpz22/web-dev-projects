<main>
<div class="subpage"><section class="block">
    <div class="container">
      <h2 class="section-title mb-5">Contact</h2>
      <div class="row g-5">
        <div class="col-lg-5">
          <p class="lead">Have a project in mind or just want to say hi? I’d love to hear from you.</p>
          <p class="mb-2">✉ <a class="contact-link" href="mailto:you@example.com">you@example.com</a></p>
          <p class="mb-2">☎ <a class="contact-link" href="tel:+630000000000">+63 000 000 0000</a></p>
          <p>⌖ Philippines</p>
        </div>
        <div class="col-lg-7">
          <form id="contactForm" class="row g-3" novalidate>
            <div class="col-md-6"><input class="form-control" id="cn" placeholder="Your name" required></div>
            <div class="col-md-6"><input class="form-control" id="ce" type="email" placeholder="Your email" required></div>
            <div class="col-12"><textarea class="form-control" id="cm" rows="5" placeholder="Your message" required></textarea></div>
            <div class="col-12 d-flex align-items-center gap-3"><button type="submit" class="btn btn-orange">Send message</button><span id="formStatus" role="status"></span></div>
          </form>
        </div>
      </div>
    </div>
  </section></div>
</main>
