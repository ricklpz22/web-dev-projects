<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bento Ba?</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    background: #111;
    overflow-x: hidden;
  }

  .gallery {
    width: 100%;
    min-height: 100vh;
    padding: 12px;
    overflow: visible;
  }

  .bento-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 220px;
    gap: 10px;
    width: 100%;
    margin: 0;
  }

  .photo {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #222;
  }

  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.45s ease;
  }

  .photo:hover img {
    transform: scale(1.05);
  }

  /* First set of 8 photos */
  .p1  { grid-area: 1 / 1 / 2 / 2; }
  .p2  { grid-area: 2 / 1 / 4 / 2; }
  .p3  { grid-area: 1 / 2 / 2 / 3; }
  .p4  { grid-area: 1 / 3 / 2 / 5; }
  .p5  { grid-area: 2 / 2 / 3 / 4; }
  .p6  { grid-area: 2 / 4 / 3 / 5; }
  .p7  { grid-area: 3 / 2 / 4 / 4; }
  .p8  { grid-area: 3 / 4 / 4 / 5; }

  /* Second set: continue below the first set */
  .p9  { grid-area: 4 / 1 / 5 / 2; }
  .p10 { grid-area: 5 / 1 / 7 / 2; }
  .p11 { grid-area: 4 / 2 / 5 / 3; }
  .p12 { grid-area: 4 / 3 / 5 / 5; }
  .p13 { grid-area: 5 / 2 / 6 / 4; }
  .p14 { grid-area: 5 / 4 / 6 / 5; }
  .p15 { grid-area: 6 / 2 / 7 / 4; }
  .p16 { grid-area: 6 / 4 / 7 / 5; }

  /* Tablet */
  @media (max-width: 768px) {
    .bento-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: 180px;
    }

    .photo {
      grid-area: auto;
    }

    .p1,
    .p4,
    .p5,
    .p7,
    .p12,
    .p13,
    .p15 {
      grid-column: span 2;
    }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .gallery {
      padding: 8px;
    }

    .bento-grid {
      grid-auto-rows: 160px;
      gap: 8px;
    }
  }
</style>

</head>
<body>
  <main class="container-fluid gallery">
    <div class="bento-grid">

      <!-- First set of containers -->
      <div class="photo p1">
        <img src="bentopics/pic1.png" alt="">
      </div>
      <div class="photo p2">
        <img src="bentopics/pic2.png" alt="">
      </div>
      <div class="photo p3">
        <img src="bentopics/pic3.png" alt="">
      </div>
      <div class="photo p4">
        <img src="bentopics/pic5.png" alt="">
      </div>
      <div class="photo p5">
        <img src="bentopics/pic6.png" alt="">
      </div>
      <div class="photo p6">
        <img src="bentopics/pic5.png" alt="">
      </div>
      <div class="photo p7">
        <img src="bentopics/pic7.png" alt="">
      </div>
      <div class="photo p8">
        <img src="bentopics/pic8.png" alt="">
      </div>

      <!-- Second set of containers -->
      <div class="photo p9">
        <img src="bentopics/pic9.png" alt="">
      </div>
      <div class="photo p10">
        <img src="bentopics/pic10.png" alt="">
      </div>
      <div class="photo p11">
        <img src="bentopics/pic11.png" alt="">
      </div>
      <div class="photo p12">
        <img src="bentopics/pic12.png" alt="">
      </div>
      <div class="photo p13">
        <img src="bentopics/pic13.png" alt="">
      </div>
      <div class="photo p14">
        <img src="bentopics/pic14.png" alt="">
      </div>
      <div class="photo p15">
        <img src="bentopics/pic15.png" alt="">
      </div>
      <div class="photo p16">
        <img src="bentopics/pic16.png" alt="">
      </div>

    </div>
  </main>
</body>
</html>
